[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agent-relay"
version = "0.1.0"
description = "Agent collaboration message relay service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "dynaconf>=3.3,<4",
  "fastapi>=0.115",
  "pydantic>=2.10",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0,<2.1",
  "sqlparse>=0.5,<1",
  "uvicorn[standard]>=0.34",
  "websockets>=17.4,<18",
  "click>=8.1,<9",
  "mcp>=2.2,<3",
]

[project.scripts]
agent-relay = "agent_relay.cli:main"

[dependency-groups]
dev = [
  "build>=1.2",
  "httpx2>=2.12.0",
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.9",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_relay"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored installer: only its marked project configuration is maintained here.
extend-exclude = ["scripts/install.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["dynaconf"]
ignore_missing_imports = true
