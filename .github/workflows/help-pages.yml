name: Help Pages

on:
  pull_request:
    paths:
      - 'help/**'
      - 'docs/guide/windows-desktop.md'
      - 'docs/guide/macos-desktop.md'
      - '.node-version'
      - '.github/workflows/help-pages.yml'
  push:
    branches:
      - feat/help-site
    paths:
      - 'help/**'
      - 'docs/guide/windows-desktop.md'
      - 'docs/guide/macos-desktop.md'
      - '.node-version'
      - '.github/workflows/help-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify help site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Set up pnpm
        working-directory: help
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          corepack pnpm --version

      - name: Install locked dependencies
        working-directory: help
        run: corepack pnpm install --frozen-lockfile

      - name: Build site
        working-directory: help
        run: corepack pnpm build

      - name: Verify generated site and accepted content
        working-directory: help
        run: corepack pnpm check:site

      - name: Test output allowlist rejection
        working-directory: help
        run: corepack pnpm test:site-check

      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/feat/help-site' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: help/.vitepress/dist
          retention-days: 1

  deploy:
    name: Deploy help site
    if: github.ref == 'refs/heads/feat/help-site' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
