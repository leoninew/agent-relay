  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#246958"/></marker></defs>
  <rect width="600" height="320" fill="#f7faf8"/>
