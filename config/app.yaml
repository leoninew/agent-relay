server:
  host: 127.0.0.1
  port: 9080
  reload: false
  reload_paths:
    - src/agent_relay/**/*.py
    - src/agent_relay/logging.yaml
    - config/*.yaml
    - .env.{profile}

static:
  directory: ./web/dist

database:
  path: ./data/agent-relay.sqlite3
  migrate_on_startup: true

codex:
  command: [codex, app-server, proxy]
  rpc_timeout: 30
  queue_concurrency: 4

logging:
  body:
    limit: 4096
  request:
    begin: "Request begin request_id=%s method=%s path=%s"
    body: "Request body request_id=%s body=%s"
    end: "Request end request_id=%s method=%s path=%s status=%d duration_ms=%d"
    failed: "Request failed request_id=%s method=%s path=%s status=%d duration_ms=%d"
  response:
    body: "Response body request_id=%s body=%s"
